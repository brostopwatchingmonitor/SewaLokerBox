<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Loker Smart</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="Mid-client-3lC1WTewIIDGmaJx"></script>
    <script>
        // Tunggu sampai snap.js selesai load
        function waitForSnap(callback, retries = 20) {
            if (window.snap) {
                callback();
            } else if (retries > 0) {
                setTimeout(() => waitForSnap(callback, retries - 1), 250);
            } else {
                alert("Gagal memuat Midtrans. Silakan refresh halaman.");
            }
        }
    </script>

</head>

<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
        <h1 class="text-2xl font-bold text-center mb-6">Pesan Loker</h1>

        <div id="step-1">
            <p class="text-gray-600 mb-4">Pilih Ukuran Loker:</p>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="selectLocker('Small', 5000)" id="btn-small"
                    class="border-2 border-blue-500 p-4 rounded-lg hover:bg-blue-50 text-center">
                    <span class="block font-bold">Small</span>
                    <span class="text-sm">Rp 5.000 /jam</span>
                </button>
                <button onclick="selectLocker('Large', 10000)" id="btn-large"
                    class="border-2 border-blue-500 p-4 rounded-lg hover:bg-blue-50 text-center">
                    <span class="block font-bold">Large</span>
                    <span class="text-sm">Rp 10.000 /jam</span>
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-bold mb-4 text-orange-500">PopSafe Detail</h2>
        <div class="border p-4 rounded-lg mb-4">
            <p class="text-gray-600">Pilihan Anda: <span id="selected-detail" class="font-bold text-red-500">Belum dipilih</span></p>
        </div>

        <button onclick="bayarLoker()" id="pay-button" disabled
            class="w-full bg-red-500 text-white font-bold py-3 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed">
            BAYAR SEKARANG
        </button>
    </div>

    <script>
    let selectedSize = '';
    let selectedPrice = 0;

    function selectLocker(size, price) {
        selectedSize = size;
        selectedPrice = price;
        
        document.getElementById('selected-detail').innerText = `${size} - 1 Jam / Rp ${price.toLocaleString('id-ID')}`;
        document.getElementById('pay-button').disabled = false;
        
        // Highlight selected button
        document.getElementById('btn-small').classList.remove('bg-blue-100');
        document.getElementById('btn-large').classList.remove('bg-blue-100');
        if (size === 'Small') document.getElementById('btn-small').classList.add('bg-blue-100');
        if (size === 'Large') document.getElementById('btn-large').classList.add('bg-blue-100');
    }

    async function bayarLoker() {
        if (!selectedSize || !selectedPrice) {
            alert("Silakan pilih ukuran loker terlebih dahulu.");
            return;
        }

        // Cek apakah snap.js sudah load
        if (!window.snap) {
            alert("Midtrans belum siap. Silakan refresh halaman dan tunggu beberapa detik.");
            return;
        }

        const payBtn = document.getElementById('pay-button');
        payBtn.disabled = true;
        payBtn.innerText = 'Memproses...';

        const payload = {
            id: `LK-${selectedSize.toUpperCase()}`,
            productName: `Sewa Loker ${selectedSize} Per Jam`,
            price: selectedPrice,
            quantity: 1
        };

        try {
            // 1. Request Token ke API
            const res = await fetch('/api/tokenizer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || 'Gagal mendapatkan token dari server');
            }

            if (!data.token) {
                throw new Error('Token tidak valid dari Midtrans');
            }

            // 2. Munculkan Snap Popup dengan callback yang lebih detail
            window.snap.pay(data.token, {
                onSuccess: function(result) {
                    console.log('Payment success:', result);
                    alert("Berhasil! Silakan Tap kartu NFC Anda.");
                },
                onPending: function(result) {
                    console.log('Payment pending:', result);
                    alert("Menunggu pembayaran...");
                },
                onError: function(result) {
                    console.error('Payment error:', result);
                    alert("Gagal bayar!");
                },
                onClose: function() {
                    console.log("Customer closed the popup");
                }
            });
        } catch (error) {
            console.error('Error:', error);
            alert("Error: " + error.message);
        } finally {
            payBtn.disabled = false;
            payBtn.innerText = 'BAYAR SEKARANG';
        }
    }
    </script>

</body>
</html>
