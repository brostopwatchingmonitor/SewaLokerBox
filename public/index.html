<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Loker Smart</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="Mid-client-3lC1WTewIIDGmaJx"></script>

</head>

<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center mb-6">Pesan Loker</h1>

        <div id="step-1">
            <p class="text-gray-600 mb-4">Pilih Ukuran Loker:</p>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="selectLocker('Small', 5000)"
                    class="border-2 border-blue-500 p-4 rounded-lg hover:bg-blue-50 text-center">
                    <span class="block font-bold">Small</span>
                    <span class="text-sm">Rp 5.000 /jam</span>
                </button>
                <button onclick="selectLocker('Large', 10000)"
                    class="border-2 border-blue-500 p-4 rounded-lg hover:bg-blue-50 text-center">
                    <span class="block font-bold">Large</span>
                    <span class="text-sm">Rp 10.000 /jam</span>
                </button>
            </div>
        </div>

        <body class="bg-gray-100 p-10">
            <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4 text-orange-500">PopSafe Detail</h2>
                <div class="border p-4 rounded-lg mb-4">
                    <p class="text-gray-600">Pilih Durasi: <span class="font-bold text-red-500">1 Jam / Rp 3.000</span>
                    </p>
                </div>

                <button onclick="bayarLoker()" id="pay-button"
                    class="w-full bg-red-500 text-white font-bold py-3 rounded-lg">
                    BAYAR SEKARANG
                </button>
            </div>
    </div>


    <script>
    async function bayarLoker() {
        const payload = {
            id: "LK-001",
            productName: "Sewa Loker Per Jam",
            price: 3000,
            quantity: 1
        };

        // 1. Request Token ke API kita
        const res = await fetch('/api/tokenizer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        // 2. Munculkan Snap Popup
        window.snap.pay(data.token, {
            onSuccess: function(result) { 
                alert("Berhasil! Silakan Tap kartu NFC Anda."); 
            },
            onPending: function(result) { 
                alert("Menunggu pembayaran..."); 
            },
            onError: function(result) { 
                alert("Gagal bayar!"); 
            }
        });
    }
    </script>

</body>

</html>
