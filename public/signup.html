<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Smart Locker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-6">
    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700">🏧 Smart Locker</h1>
            <p class="text-gray-500 mt-2">Sistem Pembayaran Loker Otomatis</p>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-xl shadow-lg text-center">
                <div class="loader mx-auto mb-4"></div>
                <p id="loading-text" class="text-gray-700 font-medium">Memuat...</p>
            </div>
        </div>

        <!-- Error Display -->
        <div id="error-display" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 mb-4">
            <p id="error-message" class="text-red-600 text-sm">-</p>
            <button onclick="hideError()" class="mt-2 text-sm text-red-600 hover:underline">Tutup</button>
        </div>

        <!-- Success Display -->
        <div id="success-display" class="hidden bg-green-50 border border-green-200 rounded-xl p-4 mb-4">
            <p id="success-message" class="text-green-600 text-sm">-</p>
        </div>

        <!-- Signup Card -->
        <div id="signup-card" class="bg-white rounded-2xl shadow-xl p-6">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Daftar Akun</h2>
                <p class="text-gray-500 text-sm mt-1">Buat akun untuk mulai menyewa loker</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="register-name" placeholder="Nama lengkap Anda" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="register-email" placeholder="email@contoh.com" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">No. Telepon</label>
                    <input type="tel" id="register-phone" placeholder="081234567890" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="register-password" placeholder="Minimal 6 karakter" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <button id="btn-register" onclick="register()" class="w-full py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition">
                    Daftar Sekarang
                </button>
                <p class="text-center text-sm text-gray-600">
                    Sudah punya akun? <a href="login.html" class="text-indigo-600 font-medium hover:underline">Masuk di sini</a>
                </p>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-500 hover:text-indigo-600">
                ← Kembali ke beranda
            </a>
        </div>
    </div>

    <script>
        // =============================================
        // AUTHENTICATION
        // =============================================

        // Check if already logged in - redirect to index
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');

        if (token && user) {
            validateAndRedirect();
        }

        async function validateAndRedirect() {
            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    window.location.href = 'index.html';
                } else {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            } catch (error) {
                console.error('Validation error:', error);
            }
        }

        function showLoading(text = 'Memuat...') {
            document.getElementById('loading-text').textContent = text;
            document.getElementById('loading-overlay').classList.remove('hidden');
            document.getElementById('btn-register').disabled = true;
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('btn-register').disabled = false;
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-display').classList.remove('hidden');
            document.getElementById('success-display').classList.add('hidden');
        }

        function hideError() {
            document.getElementById('error-display').classList.add('hidden');
        }

        function showSuccess(message) {
            document.getElementById('success-message').textContent = message;
            document.getElementById('success-display').classList.remove('hidden');
            document.getElementById('error-display').classList.add('hidden');
        }

        async function register() {
            const fullName = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const phone = document.getElementById('register-phone').value.trim();
            const password = document.getElementById('register-password').value;

            // Validation
            if (!fullName || !email || !phone || !password) {
                showError('Semua field wajib diisi!');
                return;
            }

            if (password.length < 6) {
                showError('Password minimal 6 karakter!');
                return;
            }

            if (!/^[\d\s+()-]+$/.test(phone) || phone.length < 10) {
                showError('Nomor telepon tidak valid!');
                return;
            }

            showLoading('Mendaftarkan akun...');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, phoneNumber: phone, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Save auth data
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));

                    showSuccess('Akun berhasil dibuat! Mengalihkan...');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    hideLoading();
                    showError(result.error || 'Registrasi gagal');
                }
            } catch (error) {
                hideLoading();
                showError('Terjadi kesalahan. Silakan coba lagi.');
            }
        }

        // Enter key support
        document.getElementById('register-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') register();
        });
    </script>
</body>
</html>
